name: verify

# The website loads dist/usg-meter-sizing.js straight from this branch through
# jsDelivr, so whatever is committed here is in front of customers within the
# hour. These checks are the gate: the bundle has to be rebuilt from the
# sources, and the two implementations of the rules have to agree.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      # The capacity tables ship as JSON but are maintained as a workbook.
      # Re-extracting proves the two have not been edited apart.
      - name: Capacity tables match the workbook
        run: |
          python tools/extract_capacities.py data/capacities.xlsx
          git diff --exit-code -- data/capacities.json \
            || (echo "::error::data/capacities.json does not match data/capacities.xlsx. Run tools/extract_capacities.py and commit the result." && exit 1)

      # The build has to be reproducible for the staleness check below to mean
      # anything. It once stamped the bundle with the git commit, which made
      # every rebuild differ from the committed file and failed this job on
      # every push for a reason unrelated to the rules.
      - name: Build is reproducible
        run: |
          python tools/build.py
          cp dist/usg-meter-sizing.js /tmp/first.js
          python tools/build.py
          diff -q /tmp/first.js dist/usg-meter-sizing.js \
            || (echo "::error::tools/build.py is not deterministic - two builds of the same sources differ." && exit 1)
          git checkout -- dist/usg-meter-sizing.js 2>/dev/null || true

      # A rules change in the Python without the rebuilt bundle beside it
      # would leave the website running the old rules. This is what stops it.
      - name: Bundle is up to date
        run: python tools/build.py --check

      - name: Python and JavaScript agree
        run: python tests/test_parity.py

      - name: The page reaches an answer
        run: node tests/test_block.js

      # The PDF is assembled section by section and is the one output a
      # customer keeps, so it is rendered and read back rather than eyeballed.
      - name: The PDF carries the part numbers
        run: node tests/test_pdf.js

      # Branding is easy to reintroduce by accident in a new message or
      # heading, so every customer-visible surface is swept rather than
      # eyeballed.
      - name: Nothing a customer sees says USG
        run: node tests/test_no_usg.js

      - name: API smoke test
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from api.main import app
          c = TestClient(app)
          assert c.get('/health').json()['probe_passed'] is True
          r = c.post('/api/meter-sizing', json={'inlet': 60, 'flow': 9000}).json()
          assert r['stage'] == 'meter_type', r
          print('api ok')
          "

      # The bundle is served to every visitor, so a size jump is worth
      # noticing even when nothing is wrong with it.
      - name: Report bundle size
        run: |
          echo "dist/usg-meter-sizing.js: $(wc -c < dist/usg-meter-sizing.js) bytes" >> "$GITHUB_STEP_SUMMARY"

  # Puts the tested bundle live on the website, with no hash to copy.
  #
  # The CMS block loads the bundle from jsDelivr at @main. jsDelivr caches a
  # branch URL for up to 12 hours, and its purge endpoint has been seen to
  # report success while the edge carried on serving the old file. So a purge
  # alone is not trusted: after purging, this fetches the live URL and checks
  # it is serving the build that `verify` just tested, retrying until it is.
  # If it never converges the job goes red, so a stale site is never silent.
  #
  # Runs only on a push to main, and only after every test has passed, so a
  # broken change can never reach customers through this route.
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Purge jsDelivr and confirm the new bundle is live
        env:
          REPO: ${{ github.repository }}
        run: |
          FILE="dist/usg-meter-sizing.js"
          LIVE="https://cdn.jsdelivr.net/gh/${REPO}@main/${FILE}"
          PURGE="https://purge.jsdelivr.net/gh/${REPO}@main/${FILE}"

          # The stamp is a hash of the sources, written into the bundle by
          # tools/build.py, so the committed file says which build it is.
          STAMP=$(grep -o 'var VERSION = "[0-9a-f]*"' "$FILE" | grep -o '"[0-9a-f]*"' | tr -d '"')
          if [ -z "$STAMP" ]; then
            echo "::error::Could not read the version stamp from $FILE."
            exit 1
          fi
          echo "Expecting build $STAMP at $LIVE"

          # Up to ~15 minutes. Re-purge every fourth attempt: a purge is
          # cheap, and repeating it is what clears an edge the first one
          # missed. jsDelivr rate-limits purges, which is why it is not every
          # attempt.
          for attempt in $(seq 1 30); do
            if [ $(( (attempt - 1) % 4 )) -eq 0 ]; then
              echo "--- purge ($attempt) ---"
              curl -fsS "$PURGE" || echo "(purge request failed; will retry)"
              echo
            fi
            # Exactly the URL the CMS block loads - no cache-busting query and
            # no no-cache header. Either could make this request bypass the
            # edge cache and pass while customers are still served the stale
            # copy, which would make the whole check meaningless.
            BODY=$(curl -fsS "$LIVE" || true)
            if printf '%s' "$BODY" | grep -q "var VERSION = \"${STAMP}\""; then
              echo "Live: build $STAMP is being served (attempt $attempt)."
              echo "Live on the website: build \`$STAMP\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            SEEN=$(printf '%s' "$BODY" | grep -o 'var VERSION = "[0-9a-f]*"' | head -1)
            echo "Attempt $attempt: not live yet (serving: ${SEEN:-nothing readable})."
            sleep 30
          done

          echo "::error::jsDelivr is still not serving build $STAMP after ~15 minutes. The site is running an older bundle. Re-run this job, or purge by hand: $PURGE"
          exit 1
